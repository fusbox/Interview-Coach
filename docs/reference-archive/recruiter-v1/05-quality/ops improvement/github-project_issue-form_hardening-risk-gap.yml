name: Hardening / Risk Gap
description: Track a security, privacy, persistence, auth, logging, or data-retention gap
title: "[Hardening] "
labels:
  - hardening
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the gap clearly.
    validations:
      required: true
  - type: textarea
    id: why_it_matters
    attributes:
      label: Why It Matters
      description: What user, business, release, or compliance risk does this create?
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current Behavior
      description: What does the system do today?
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Desired Behavior
      description: What should the system do instead?
    validations:
      required: true
  - type: dropdown
    id: risk_level
    attributes:
      label: Risk Level
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: data_involved
    attributes:
      label: Data Involved
      description: What data classes or sensitive fields are involved?
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: One checklist item per line.
      placeholder: |
        - [ ] 
        - [ ] 
        - [ ] 
  - type: textarea
    id: open_questions
    attributes:
      label: Open Questions
      description: List any unresolved questions or dependencies.
