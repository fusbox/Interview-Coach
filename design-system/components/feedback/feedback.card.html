<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-sans); }
  .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: hsl(var(--text-muted)); margin: 4px 0 8px; }
  .stack { display: grid; gap: 10px; margin-bottom: 20px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { AlertPanel, FeedbackPanel, FeedbackCard, EmptyState, Button } = window.RangamJobSeekerDesignSystem_7ff43f;
  function Demo() {
    return (
      <div>
        <div className="lbl">AlertPanel</div>
        <div className="stack">
          <AlertPanel tone="info" icon>Your invite link expires in 7 days.</AlertPanel>
          <AlertPanel tone="success" icon>Answer saved — the coach is reviewing it.</AlertPanel>
          <AlertPanel tone="critical" icon weight="semibold">Could not save your answer. Try again.</AlertPanel>
        </div>
        <div className="lbl">FeedbackPanel</div>
        <div className="stack">
          <FeedbackPanel title="Answer structure" assessment="growth" body="Strong example — lead with the outcome before the details." />
          <FeedbackPanel title="Role fit" assessment="outstanding" body="Clear, specific, and tied directly to the target role." />
        </div>
        <div className="lbl">FeedbackCard · EmptyState</div>
        <div className="two">
          <FeedbackCard title="How confident do you feel?" scaleType="numeric" lowLabel="Not yet" highLabel="Very" />
          <EmptyState title="No practice yet" description="Start your first round to see your preparedness." actions={<Button>Create Practice</Button>} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
