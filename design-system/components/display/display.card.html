<!-- @dsCard group="Components" viewport="700x420" name="Display" subtitle="Cards, badges, metrics, progress" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: rgb(248 250 252); font-family: var(--font-sans); }
  .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: hsl(var(--text-muted)); margin: 4px 0 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { SurfaceCard, MetricCard, Badge, StatusBadge, IconBadge, InsightCard, Progress, Icon } = window.RangamJobSeekerDesignSystem_7ff43f;
  function Demo() {
    return (
      <div>
        <div className="lbl">Badge · StatusBadge · IconBadge</div>
        <div className="row">
          <Badge>New</Badge>
          <Badge variant="high">Strong</Badge>
          <Badge variant="outline">Draft</Badge>
          <StatusBadge variant="success">Completed</StatusBadge>
          <StatusBadge variant="progressSolid">In progress</StatusBadge>
          <StatusBadge variant="readinessMedium" size="sm">Emerging</StatusBadge>
          <IconBadge variant="primary"><Icon name="clock" size={18} /></IconBadge>
          <IconBadge variant="success"><Icon name="check-circle" size={18} /></IconBadge>
        </div>
        <div className="lbl">MetricCard · Progress</div>
        <div className="row" style={{ alignItems: 'stretch' }}>
          <div style={{ width: 180 }}><MetricCard title="Sessions" value={12} trend={{ value: '18%', positive: true }} /></div>
          <div style={{ width: 140 }}><MetricCard title="Readiness" value="High" variant="pill" valueStyle={{ color: 'hsl(var(--state-success))' }} /></div>
          <div style={{ flex: 1, minWidth: 200, alignSelf: 'center' }}>
            <Progress value={62} />
            <div style={{ marginTop: 6, fontSize: 12, color: 'hsl(var(--text-muted))' }}>62% of question set practiced</div>
          </div>
        </div>
        <div className="lbl">SurfaceCard + InsightCard</div>
        <SurfaceCard eyebrow="Coach Update" title="What I noticed" description="A quick read on your last round.">
          <div style={{ display: 'grid', gap: 10, gridTemplateColumns: '1fr 1fr' }}>
            <InsightCard tone="positive"><strong>Strength</strong> — concrete outcomes in every answer.</InsightCard>
            <InsightCard tone="caution"><strong>Watch</strong> — lead with the result before details.</InsightCard>
          </div>
        </SurfaceCard>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
