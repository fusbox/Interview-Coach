<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: rgb(248 250 252); font-family: var(--font-sans); }
  .stage { display: flex; gap: 24px; align-items: flex-start; }
  .board { flex: 1; }
  .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: hsl(var(--text-muted)); margin: 0 0 8px; }
  .dockwrap { position: relative; height: 120px; border-radius: 24px; background: rgb(232 241 255 / 0.5); border: 1px dashed rgb(211 221 232); overflow: hidden; }
  .dockwrap nav { position: absolute !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { CandidateSidebar, CandidateMobileDock, CandidateDisclosureFooter, ActionButton } = window.RangamJobSeekerDesignSystem_7ff43f;
  function Demo() {
    return (
      <div>
        <div className="stage">
          <div style={{ height: 340, borderRadius: 20, overflow: 'hidden', border: '1px solid rgb(211 221 232 / 0.7)' }}>
            <CandidateSidebar activeLabel="Practice" logoSrc="../../assets/TA-logo.png"
              footer={<ActionButton size="large">New practice</ActionButton>} />
          </div>
          <div className="board">
            <div className="lbl">Mobile dock (floats bottom-center in app)</div>
            <div className="dockwrap"><CandidateMobileDock activeLabel="Dashboard" /></div>
            <div className="lbl" style={{ marginTop: 20 }}>Disclosure footer</div>
            <CandidateDisclosureFooter />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
