<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: rgb(248 250 252); font-family: var(--font-sans); }
  .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: hsl(var(--text-muted)); margin: 16px 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { PageIntro, SectionHeader, SessionPromptShell, DataTable, Button, StatusBadge } = window.RangamJobSeekerDesignSystem_7ff43f;
  function Demo() {
    const cols = [{ key: 'q', label: 'Question' }, { key: 'cat', label: 'Category' }, { key: 'st', label: 'Status', align: 'right' }];
    const rows = [
      { id: 1, q: 'Tell me about yourself', cat: 'Screening', st: 'done' },
      { id: 2, q: 'A time you resolved conflict', cat: 'Behavioral', st: 'prog' },
      { id: 3, q: 'Design a rate limiter', cat: 'Technical', st: 'idle' },
    ];
    const map = { done: ['success', 'Clear'], prog: ['progressSolid', 'In progress'], idle: ['progressIdle', 'Not practiced'] };
    return (
      <div>
        <PageIntro eyebrow="Practice" title="Let's get you ready" description="You'll answer interview-style questions tailored to your target role." />
        <div className="lbl">SessionPromptShell</div>
        <SessionPromptShell>
          <p className="eyebrow" style={{ marginTop: 0 }}>Question 2 of 8 · Behavioral</p>
          <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 24, margin: '8px 0 0' }}>Tell me about a time you resolved a conflict on your team.</h2>
        </SessionPromptShell>
        <div className="lbl">SectionHeader + DataTable</div>
        <SectionHeader eyebrow="Coach Plan" title="Question set" actions={<Button variant="ghost" size="sm">View all</Button>} />
        <div style={{ marginTop: 12 }}>
          <DataTable columns={cols} rows={rows} renderCell={(r, c) => c.key === 'st'
            ? <StatusBadge variant={map[r.st][0]} size="sm">{map[r.st][1]}</StatusBadge>
            : r[c.key]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
