<!-- @dsCard group="Type" viewport="700x150" name="Metric value" subtitle="Semantic metric role for dashboard values" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;gap:40px;align-items:flex-end;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .lbl{font-size:var(--text-micro-size);font-weight:700;text-transform:uppercase;letter-spacing:var(--text-micro-tracking);line-height:var(--text-micro-line);color:rgb(86 106 131);}
  .val{color:rgb(15 33 57);}
</style></head>
<body>
  <div class="stat"><span class="lbl">Sessions</span><span class="val type-metric-value">12</span></div>
  <div class="stat"><span class="lbl">Readiness</span><span class="val type-metric-value" style="color:hsl(160 60% 36%)">High</span></div>
  <div class="stat"><span class="lbl">Questions</span><span class="val type-metric-value">8</span></div>
</body></html>
