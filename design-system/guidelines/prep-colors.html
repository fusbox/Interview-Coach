<!-- Partial — embedded in interview-coach-design-system.html (Foundations › Color). Not a standalone card. -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;font-family:var(--font-sans);background:#fff;color:#0F2139;}
  .ramp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  .cell{border:1px solid #EEF1F5;border-radius:12px;overflow:hidden;}
  .cell .top{height:56px;display:flex;align-items:center;justify-content:center;}
  .cell .dot{width:20px;height:20px;border-radius:99px;box-shadow:0 0 0 4px rgba(255,255,255,.6);}
  .cell .m{padding:10px 12px;}
  .cell .n{font-size:12px;font-weight:700;margin:0;}
  .cell .tok{font-size:9.5px;font-family:monospace;color:#566A83;margin:4px 0 0;}
  .cell .hex{font-size:9.5px;font-family:monospace;color:#94A3B8;margin:1px 0 0;}
  .cell .okl{font-size:9px;font-family:monospace;color:#B4C0CC;margin:1px 0 0;}
  .pills{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px;}
  .pill .pd{width:8px;height:8px;border-radius:99px;}
</style></head>
<body>
  <div class="ramp">
    <div class="cell"><div class="top" style="background:#F1F5F9"><span class="dot" style="background:oklch(0.72 0.02 240)"></span></div><div class="m"><p class="n">Not practiced</p><p class="tok">--prep-not-practiced</p><p class="hex">#9AA7B0</p><p class="okl">oklch(.72 .02 240)</p></div></div>
    <div class="cell"><div class="top" style="background:oklch(0.96 0.035 100)"><span class="dot" style="background:oklch(0.82 0.09 100)"></span></div><div class="m"><p class="n">Emerging</p><p class="tok">--prep-emerging</p><p class="hex">#D1C681</p><p class="okl">oklch(.82 .09 100)</p></div></div>
    <div class="cell"><div class="top" style="background:oklch(0.94 0.07 143)"><span class="dot" style="background:oklch(0.62 0.15 143)"></span></div><div class="m"><p class="n">Clear</p><p class="tok">--prep-clear</p><p class="hex">#479C44</p><p class="okl">oklch(.62 .15 143)</p></div></div>
    <div class="cell"><div class="top" style="background:oklch(0.93 0.05 160)"><span class="dot" style="background:oklch(0.50 0.12 160)"></span></div><div class="m"><p class="n">Strong</p><p class="tok">--prep-strong</p><p class="hex">#00774B</p><p class="okl">oklch(.50 .12 160)</p></div></div>
  </div>
  <div class="pills">
    <span class="pill" style="background:#F1F5F9;color:oklch(0.46 0.03 240)"><span class="pd" style="background:oklch(0.72 0.02 240)"></span>Not practiced</span>
    <span class="pill" style="background:oklch(0.96 0.035 100);color:oklch(0.44 0.07 100)"><span class="pd" style="background:oklch(0.82 0.09 100)"></span>Emerging</span>
    <span class="pill" style="background:oklch(0.94 0.07 143);color:oklch(0.42 0.10 143)"><span class="pd" style="background:oklch(0.62 0.15 143)"></span>Clear</span>
    <span class="pill" style="background:oklch(0.93 0.05 160);color:oklch(0.36 0.10 160)"><span class="pd" style="background:oklch(0.50 0.12 160)"></span>Strong</span>
  </div>
</body></html>
