<!-- @dsCard group="Brand" viewport="700x170" name="Glass & blur" subtitle="Pale-blue glass card + overlay capsule" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;font-family:var(--font-sans);background:linear-gradient(120deg,rgb(12 97 233),rgb(14 176 153));}
  .glass-card{border-radius:24px;padding:20px;color:rgb(15 33 57);}
  .n{font-size:13px;font-weight:700;}
  .c{font-size:11px;font-family:monospace;color:rgb(86 106 131);}
  .cap{margin-top:14px;display:inline-block;padding:8px 16px;border-radius:9999px;background:rgba(255,255,255,.4);backdrop-filter:blur(16px);font-size:12px;font-weight:600;color:#fff;}
</style></head>
<body>
  <div class="glass-card">
    <span class="n">.glass-card</span><br><span class="c">pale-blue gradient · blur(24px) · white/20 border</span>
    <div class="cap">bg-white/40 backdrop-blur capsule</div>
  </div>
</body></html>
